name: Build AERA Recovery (courbet)

on:
  workflow_dispatch:
  push:
    branches: [aera-16.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      DEVICE: courbet
      MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/az \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/share/miniconda /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "After cleanup:"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libc6-dev-i386 libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 libxml2-utils libgl1-mesa-dev \
            libx11-dev x11proto-core-dev lzop pngcrush rsync schedtool \
            squashfs-tools erofs-utils xsltproc zip zlib1g-dev fontconfig \
            python3 python-is-python3 unzip
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "qualixxe"
          git config --global user.email "qualixxe@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync AERA source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AERA_16.0"
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j4
          echo "After sync:"; df -h /; du -sh .repo 2>/dev/null || true
          # The checked-out trees are all the build needs; drop the git object
          # stores to free ~16 GiB for out/ and swap.
          rm -rf .repo/project-objects .repo/projects .repo/manifests.git || true
          echo "After pruning .repo:"; df -h /

      - name: Place courbet device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi"
          rm -rf "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"
          cp -r "$GITHUB_WORKSPACE/device-tree" "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"
          rm -rf "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet/.git"
          ls -la "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"

      - name: Set up swap
        run: |
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== memory ==="; free -h
          echo "=== disk ==="; df -h /

      - name: Build recoveryimage
        run: |
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          export AERA_BUILD_DEVICE="$DEVICE"
          source build/envsetup.sh
          lunch twrp_${DEVICE}-bp2a-eng
          mka -j3 adbd recoveryimage 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
        continue-on-error: true

      - name: Collect output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          OUT="out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          echo "=== output dir ==="; ls -la "$OUT" 2>/dev/null || true
          cp "$OUT"/*.img "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp "$OUT"/*.zip "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp "$OUT"/recovery.img "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          tail -n 200 "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/artifact/build-tail.log" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifact"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            artifact/build-tail.log
          compression-level: 9

      - name: Upload recovery image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-courbet-image
          path: artifact/*.img
          if-no-files-found: warn
          compression-level: 6

      - name: Upload flashable zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AERA-courbet-zip
          path: artifact/*.zip
          if-no-files-found: warn
          compression-level: 6