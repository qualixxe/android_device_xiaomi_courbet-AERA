name: Build AERA Recovery (courbet)

on:
  workflow_dispatch:
  push:
    branches: [aera-16.0]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEVICE: courbet
      MANIFEST_URL: https://github.com/AERA-Recovery/android_manifest.git
      MANIFEST_BRANCH: aera-16.0
      # Reduce peak Go heap during the Soong graph-generation phase.
      # This is a mitigation, not a confirmed diagnosis of the old runner shutdown.
      GOGC: "40"
      GOMEMLIMIT: 8GiB
      GOMAXPROCS: "2"
      # Hosted runners run an internal resource monitor that cancels the job
      # ("runner received a shutdown signal", exit 143) when free RAM bottoms
      # out. soong analysis reads tens of GiB of sources, the page cache fills
      # all RAM even though nothing is out of memory, and the monitor kills
      # the runner. These logs make its verdict visible in the job log.
      ACTIONS_RUNNER_DEBUG: true
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free disk space
        run: |
          echo "Before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/az \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/share/miniconda /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "After cleanup:"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libc6-dev-i386 libelf-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2 libxml2-utils libgl1-mesa-dev \
            libx11-dev x11proto-core-dev lzop pngcrush rsync schedtool \
            squashfs-tools erofs-utils xsltproc zip zlib1g-dev fontconfig \
            python3 python-is-python3 unzip
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "qualixxe"
          git config --global user.email "qualixxe@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync AERA source (partial, recovery-only)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AERA_16.0"
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" --depth=1 --no-clone-bundle
          # The AERA manifest resolves to 412 projects; most are irrelevant
          # for a recovery-only build, and soong analysis over the full tree
          # exhausts the hosted runner's memory ("shutdown signal", exit 143).
          # Sync only the curated subset listed in
          # device-tree/.github/sync-paths.txt (~207 projects, generated from
          # the resolved manifest so every path is valid). The modules that
          # vanish with the dropped projects (framework, mainline apexes, ...)
          # are tolerated at build time via ALLOW_MISSING_DEPENDENCIES=true,
          # the same mode AOSP/TWRP thin manifests use.
          repo list | awk '{print $1}' > "$GITHUB_WORKSPACE/all-paths.txt"
          grep -Fx -f "$GITHUB_WORKSPACE/device-tree/.github/sync-paths.txt" \
            "$GITHUB_WORKSPACE/all-paths.txt" > "$GITHUB_WORKSPACE/to-sync.txt" || true
          echo "Partial sync: $(wc -l < "$GITHUB_WORKSPACE/to-sync.txt") of $(wc -l < "$GITHUB_WORKSPACE/all-paths.txt") projects"
          xargs -a "$GITHUB_WORKSPACE/to-sync.txt" \
            repo sync -c --force-sync --no-clone-bundle --no-tags -j4
          repo manifest -r -o "$GITHUB_WORKSPACE/source-manifest.xml"
          echo "After sync:"; df -h /; du -sh .repo 2>/dev/null || true
          # The checked-out trees are all the build needs; drop the git object
          # stores to free disk for out/ and swap.
          rm -rf .repo/project-objects .repo/projects .repo/manifests.git || true
          echo "After pruning .repo:"; df -h /

      - name: Place courbet device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi"
          rm -rf "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"
          cp -r "$GITHUB_WORKSPACE/device-tree" "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"
          rm -rf "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet/.git"
          ls -la "$GITHUB_WORKSPACE/AERA_16.0/device/xiaomi/courbet"

      - name: Set up swap
        run: |
          echo "=== memory before ==="; free -h; swapon --show || true
          SWAP=/swapfile-build
          sudo swapoff "$SWAP" 2>/dev/null || true
          sudo rm -f "$SWAP"
          sudo fallocate -l 16G "$SWAP" || sudo dd if=/dev/zero of="$SWAP" bs=1M count=16384
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          echo "=== memory after ==="; free -h; swapon --show
          echo "=== disk ==="; df -h /

      - name: Build recoveryimage
        id: compile
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          # Disable systemd-oomd: it also SIGTERMs the runner service on
          # memory pressure instead of letting the swapfile absorb it.
          sudo systemctl disable --now systemd-oomd 2>/dev/null || true
          sudo systemctl mask systemd-oomd 2>/dev/null || true
          # Periodically drop the page cache so the hosted-runner resource
          # monitor keeps seeing free RAM while soong reads tens of GiB of
          # sources. Without this, MemFree hits zero during soong analysis
          # and the runner cancels the job ("shutdown signal", exit 143).
          ( while sleep 45; do
              sync
              sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' 2>/dev/null || true
            done ) >> "$GITHUB_WORKSPACE/resources.log" 2>&1 &
          MONITOR_PID=$!
          export AERA_BUILD_DEVICE="$DEVICE"
          # Thin-manifest mode: the partial sync omits framework/mainline
          # projects, so missing modules and dependencies must be tolerated.
          export ALLOW_MISSING_DEPENDENCIES=true
          # Retain diagnostics for runner stalls and memory/disk pressure.
          (
            while sleep 60; do
              date -u
              free -h
              df -h /
              ps -eo pid,comm,rss,%cpu --sort=-rss | head -n 12 || true
            done
          ) >> "$GITHUB_WORKSPACE/resources.log" 2>&1 &
          WATCH_PID=$!
          trap 'kill "$MONITOR_PID" "$WATCH_PID" 2>/dev/null || true' EXIT
          {
            source build/envsetup.sh
            lunch twrp_${DEVICE}-bp2a-eng
            mka -j2 adbd recoveryimage
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          # Never report a successful build without an actual image.
          test -s "out/target/product/$DEVICE/recovery.img"
          python3 "$GITHUB_WORKSPACE/device-tree/tools/check_image.py" \
            "out/target/product/$DEVICE/recovery.img"

      - name: Collect output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/AERA_16.0"
          OUT="out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          echo "=== output dir ==="; ls -la "$OUT" 2>/dev/null || true
          cp "$OUT"/*.img "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp "$OUT"/*.zip "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          cp "$OUT"/recovery.img "$GITHUB_WORKSPACE/artifact/" 2>/dev/null || true
          (cd "$GITHUB_WORKSPACE/artifact"; sha256sum ./*.img > SHA256SUMS 2>/dev/null) || true
          tail -n 200 "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/artifact/build-tail.log" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifact"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            artifact/build-tail.log
            resources.log
            source-manifest.xml
          compression-level: 9

      - name: Upload recovery image
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AERA-courbet-image
          path: |
            artifact/*.img
            artifact/SHA256SUMS
          if-no-files-found: warn
          compression-level: 6

      - name: Upload flashable zip
        if: always() && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AERA-courbet-zip
          path: artifact/*.zip
          if-no-files-found: warn
          compression-level: 6